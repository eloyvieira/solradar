x-service-template: &service
  build:
    context: ..
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file: ../.env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    rabbitmq: { condition: service_healthy }

services:

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set rabbit user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set rabbit password}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbit_data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15

  collector:
    <<: *service
    command: collector

  arbitrage-detector:
    <<: *service
    command: arbitrage-detector

  pump-detector:
    <<: *service
    command: pump-detector

  security-analyzer:
    <<: *service
    command: security-analyzer

  executor:
    <<: *service
    command: executor

  position-monitor:
    <<: *service
    command: position-monitor

  trade-ledger:
    <<: *service
    command: trade-ledger
    
volumes:
  mysql_data:
  rabbit_data:
